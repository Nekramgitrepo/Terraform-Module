trigger:
  branches:
    include:
      - main

pool: nekramagent

stages:
  - stage: 
    displayName: Terraformmodule
    jobs:
      - job: 
        displayName: Terraform module run
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: tfsec@1
          inputs:
            version: 'v1.26.0'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'nekram svc'
            backendAzureRmResourceGroupName: 'dev-rgnew'
            backendAzureRmStorageAccountName: 'devstorageado'
            backendAzureRmContainerName: 'adocontainer'
            backendAzureRmKey: 'module.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'nekram svc'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'nekram svc'



